name: Feature request
description: Propose new or changed behavior
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: "Problem / user need"
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposed behavior"
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: "Acceptance criteria"
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: "Alternatives considered"
  - type: dropdown
    id: risk
    attributes:
      label: Risk level
      options: [Trivial, Standard, High risk]
    validations:
      required: true
