name: CI

# What a contributor runs before opening a pull request (docs/development.md#the-checks), run on every pull request and
# every push to main. It only reads the repository: no secret is used, nothing is published and no job can write.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: python (lint, types, tests)
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check .
      - name: Formatting
        run: ruff format --check .
      - name: Types
        run: mypy src
      - name: The OpenAPI document is current
        run: python scripts/export_openapi.py --check
      # The tests that need Docker, a browser, PostgreSQL, Redis, Ollama or a long run are left out: see
      # docs/development.md#tests for what each needs and docs/development.md#verification-status for what was run.
      - name: Tests
        run: pytest tests -q -m "not docker and not browser and not postgres and not redis and not ollama and not matrix"

  web:
    name: web (types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: npm ci
      - name: The API types are generated from the OpenAPI document
        run: npm run gen:api && git diff --exit-code -- src/api/schema.d.ts
      - name: Tests
        run: npm test
      - name: Type-check and build
        run: npm run build

  image:
    name: image (docker build)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: docker build -f docker/Dockerfile -t agentlab:ci .
