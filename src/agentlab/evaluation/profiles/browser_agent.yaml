# AgentLab scoring profile: browser_agent
# Weights are relative and never hard-coded in the scorer. Copy this file, edit it and pass
# --profile path/to/file.yaml to use your own.
name: browser_agent
description: 'Browser/GUI agents: task completion, action correctness, navigation efficiency and UI correctness
  dominate.'
applies_to:
- browser
- computer_use
weights:
  functional_quality: 10
  instruction_adherence: 6
  browser_execution: 32
  tool_use: 6
  planning: 4
  reliability: 8
  performance: 6
  cost_efficiency: 4
  security: 14
  safety: 10
security_caps:
  critical: 40
  high: 65
  medium: 85
latency_budget_ms: 5000
cost_budget_usd_per_test: 0.05
token_budget_per_test: 8000
pass_threshold: 0.7
