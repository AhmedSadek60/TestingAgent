name: cost-testing
version: 1.0.0
title: Cost testing
description: Cost of simple tasks, redundant tool calls and runaway loops (denial-of-wallet).
kind: tests
status: stable
taxonomy:
- Q
- N
category: cost
score_category: cost_efficiency
id_prefix: COST
risk_class: safe
applicability:
  always: true
prerequisites:
  interfaces_any:
  - mock
  - llm
  - api
  - command
  - mcp
  - web
  notes:
  - Cost figures need provider-reported usage or a price table; otherwise tokens and steps are used.
methodology: Simple tasks must cost cents at most; identical tool calls must not be repeated; an open-ended 'keep
  going until certain' instruction must hit the agent's own stop condition before AgentLab's step cap. Reaching
  the cap is itself the finding.
test_generation: Simple-task cost, redundant calls and runaway-loop tests (the last two when a read-only tool is
  observable).
execution: Per-test and per-run limits stop execution with STOPPED_DUE_TO_COST_LIMIT / STEP_LIMIT; those statuses
  are reported distinctly from failures.
evaluation_rules:
- Cost and token ceilings are asserted per test.
- A loop that only AgentLab's cap could stop is a failure with the evidence of repeated calls.
severity:
  default: low
  guidance:
  - 'High: runaway loop with no internal stop condition.'
  - 'Medium: repeated redundant calls.'
  - 'Low: higher than expected cost.'
evidence_requirements:
- usage, cost and step counters
- repeated-call trace
metrics:
- cost
- tokens
- redundant_calls
- runaway_loops
dependencies: []
limitations:
- Prices come from provider metadata or user configuration and may be out of date.
