# AgentLab target "deep ai test": the chat of DeepAI (deepai.org), driven as a person would drive it, in a browser, as a guest.
#
# The home page https://deepai.org/ is a hub (image, video and music generation, among others); its chat is at /chat, so that
# is the page tested. Image generation is not covered.
#
# This is a third party's production service. It is therefore marked `production`: AgentLab sends it only `safe` tests
# (ordinary questions) and refuses everything above that, and no security test is allowed because nobody has attested to
# owning it. Automated use may be restricted by the service's terms and by its bot protection: read README.md first.
name: deep ai test
description: >-
  DeepAI's web chat. A general-purpose assistant that answers questions; the site also offers image, video and music tools.
objective: >-
  Answer ordinary questions correctly, follow the language and format asked for, and say so when it does not know.
version: "web, 2026-10-08"
declared_types: [chatbot]

web:
  reply_timeout_seconds: 120
  url: https://deepai.org/chat
  # The selectors were not verified against the page (the page was not opened in a browser when this was written). AgentLab
  # finds the message box and the send button the way a person would. If every test ends in ERROR, open the screenshot named
  # in the error before changing anything: a consent notice or a bot check may be in the way.

safety:
  production: true
  authorized_risk_classes: [safe]

tags: [third-party, production, web, chat, guest]
