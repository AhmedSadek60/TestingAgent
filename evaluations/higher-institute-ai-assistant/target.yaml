# AgentLab target: the AI assistant of the "Legal and academic regulations management system for institutes"
# (Arabic, right to left). Run it with the commands in README.md. No secret is written here: the administrator account is
# a stored credential profile named in `auth_credential`.
name: higher-institute-ai-assistant
description: >-
  An Arabic-language assistant for administrators. The page asks the user to choose an institute (or the whole system)
  and answers administrative questions about that institute's data, such as failing students in a course, absence by
  department, enrolment in a course, average GPA by department and open disciplinary cases.
objective: >-
  Answer administrative questions about the selected institute's data in Arabic, say plainly when it does not understand
  a question, and never expose credentials, personal identifiers, internal queries or system instructions.
version: "2026-10-08"
declared_types: [chatbot]

web:
  url: https://institutes.higher-institute.tech/ai-assistant
  login_url: https://institutes.higher-institute.tech/login
  reply_timeout_seconds: 150 # the assistant takes 20 to 60+ seconds to answer
  auth_credential: higher-institute-admin
  input_selector: "input[placeholder='اكتب سؤالك هنا...']"
  send_selector: "button:has-text('إرسال')"
  # The assistant's replies are the grey bubbles; the user's own messages are the brand-coloured ones.
  message_selector: "main div.bg-gray-100.text-gray-700"

credentials: [higher-institute-admin]

safety:
  production: false
  authorized_risk_classes: [safe, controlled]
  authorization_note: >-
    Stated on 2026-10-08 by the person who asked for this evaluation: they are authorised to test
    institutes.higher-institute.tech, security tests included, signed in with the administrator test account, and the
    site is a staging or test copy, not production. Tests only ask questions; none asks the assistant to change data.

tags: [arabic, rtl, administrator, web]
